<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Recommendations</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://tiberiusgh.com/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="https://tiberiusgh.com/favicon-96x96.png"
    />
    <link rel="shortcut icon" href="https://tiberiusgh.com/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://tiberiusgh.com/apple-touch-icon.png"
    />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/index.js" defer></script>
  </head>
  <body>
    <main>
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="https://tiberiusgh.com">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M15 18l-6-6 6-6" />
          </svg>
          tiberiusgh.com
        </a>
      </nav>

      <header class="hero">
        <p class="hero-eyebrow">2DV515 · movie recommendation system</p>
        <h1><span class="hero-greeting">Movie</span> recommendations.</h1>
        <p class="hero-lead">
          Pick a user to see who rates movies most like them, and which movies
          they haven&rsquo;t seen yet are likely to be a good fit.
        </p>
      </header>

      <section>
        <h2 class="section-title">Search</h2>
        <form id="search-form" class="controls">
          <label class="field">
            <span class="field-label">User</span>
            <select id="user-select" required></select>
          </label>
          <label class="field">
            <span class="field-label">Algorithm</span>
            <select id="algorithm-select">
              <option value="euclidean">Euclidean</option>
              <option value="pearson">Pearson</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Results</span>
            <input id="result-count" type="number" inputmode="numeric" min="1" value="3" required />
          </label>
          <button type="submit">Find recommendations</button>
          <span id="status" class="status"></span>
        </form>
      </section>

      <section id="results" class="results hidden">
        <div>
          <h2 class="section-title">Recommended movies</h2>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Movie</th>
                <th class="number">Score</th>
              </tr>
            </thead>
            <tbody id="recommendations-body"></tbody>
          </table>
        </div>
        <div>
          <h2 class="section-title">Similar users</h2>
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th class="number">Algorithm</th>
              </tr>
            </thead>
            <tbody id="similar-users-body"></tbody>
          </table>
        </div>
      </section>

      <footer>
        <p>&copy; 2026 tiberius gherac</p>
      </footer>
    </main>
  </body>
</html>
